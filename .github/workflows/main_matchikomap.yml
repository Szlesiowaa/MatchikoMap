# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - matchikomap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build ./sourceCode/MatchikoMap/MatchikoMap.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./sourceCode/MatchikoMap/MatchikoMap.csproj -c Release -o ./publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CA6488CFA3814ECDB584BF4254CF5F16 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C97EAE615F8D40D2B0DAC8C2DCE30A15 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A093AD5371E347D1AAD6AAFDAC93FB08 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'matchikomap'
          slot-name: 'Production'
          package: ./publish 
          